name: Publish libaeon release assets

# Frictionless-Aeon-distribution mechanism for harness-engine
# (github.com/mustafarslan/harness-engine, cli/aeon_fetch.py). That module
# resolves a prebuilt libaeon for the caller's platform from this repo's
# GitHub Releases -- one asset per (os, arch), named exactly
# libaeon-<os>-<arch>.<ext> to match cli/aeon_fetch.py::_platform_asset_name().
# Do not rename these assets without updating that function to match.
#
# Reuses the same CMake presets as build_and_test.yml, but builds only the
# aeon_shared target explicitly (not the full default set -- the release
# artifact doesn't need aeon_tests/aeon_bench/aeon_py_core or their extra
# deps).
#
# macOS (arm64) only for now -- v0.1.0's first real release run (2026-08-17)
# found Linux and Windows both genuinely fail to compile aeon_shared, neither
# related to this workflow:
#   - Linux (GCC 14.2, Release + -O2 -flto): a libstdc++ <concepts> internal-
#     ordering bug ("_S_noexcept used before its definition") triggered by
#     atlas.cpp's std::span-based int8_dot_fn call.
#   - Windows (MSVC): platform.hpp:53's reinterpret_cast<int-to-pointer> is
#     rejected under MSVC's constexpr rules, and trace.cpp's compact() uses
#     new_base/new_fd that are never declared on this platform -- looks like
#     a POSIX-only (mmap-based) code path with no Windows branch implemented.
# Both need real fixes in core/ itself, not a CI workaround -- re-add their
# matrix legs (kept as a template below, commented out) once fixed upstream.
# Until then, cli/aeon_fetch.py's own per-platform AeonFetchError (naming the
# manual-build fallback) is the correct, honest behavior for those platforms.

on:
  push:
    tags: ["v*"]

env:
  BUILD_TYPE: Release
  AEON_CI_BUILD: "ON"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --draft

  build-and-upload:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            cc: clang
            cxx: clang++
            preset: ci-macos
            install_deps: |
              brew install cmake ninja simde
            configure_extra: ""
            built_library: build/ci-macos/lib/libaeon.dylib
            asset_name: libaeon-macos-arm64.dylib

          # -- Linux and Windows, disabled for now, see comment at the top of
          # this file. Re-enable once core/ builds cleanly on both.
          # - os: ubuntu-24.04
          #   cc: gcc-14
          #   cxx: g++-14
          #   preset: ci-linux
          #   install_deps: |
          #     sudo apt-get update -qq
          #     sudo apt-get install -y --no-install-recommends \
          #       cmake ninja-build libopenblas-dev
          #     git clone --depth 1 https://github.com/simd-everywhere/simde.git /tmp/simde
          #   configure_extra: -DSIMDE_INCLUDE_DIR=/tmp/simde
          #   built_library: build/ci-linux/lib/libaeon.so
          #   asset_name: libaeon-linux-x86_64.so
          # - os: windows-latest
          #   cc: cl
          #   cxx: cl
          #   preset: ci-windows
          #   install_deps: |
          #     choco install cmake ninja -y
          #     vcpkg install openblas:x64-windows
          #     git clone --depth 1 https://github.com/simd-everywhere/simde.git "$env:RUNNER_TEMP\simde"
          #   configure_extra: ""
          #   built_library: build/ci-windows/bin/aeon.dll
          #   asset_name: libaeon-windows-x86_64.dll

    name: "build ${{ matrix.asset_name }}"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        shell: bash
        run: ${{ matrix.install_deps }}
        if: runner.os != 'Windows'

      - name: Install Dependencies (Windows)
        shell: pwsh
        run: ${{ matrix.install_deps }}
        if: runner.os == 'Windows'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # core/CMakeLists.txt's find_package(nanobind ...) runs unconditionally
      # at configure time (it's not gated behind the aeon_shared target), so
      # this is needed even though the release build only targets aeon_shared
      # -- confirmed live, v0.1.0's first release run failed configure on
      # every platform without it (CMake Error: Could not find a package
      # configuration file provided by "nanobind").
      - name: Install Python build dependencies
        run: pip install nanobind numpy scikit-build-core

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.configure_extra }}

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $simdeDir = "$env:RUNNER_TEMP\simde"
          $vcpkgToolchain = "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake --preset ${{ matrix.preset }} `
            -DSIMDE_INCLUDE_DIR="$simdeDir" `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchain"

      # Explicit target -- the release artifact is just the C-API shared
      # library, not the full default build (tests/benchmarks/python bindings
      # need extra deps this job doesn't install).
      - name: Build aeon_shared
        run: cmake --build --preset ${{ matrix.preset }} --target aeon_shared

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ matrix.built_library }}" "${{ matrix.asset_name }}"
          gh release upload "${{ github.ref_name }}" "${{ matrix.asset_name }}" \
            --repo "${{ github.repository }}" \
            --clobber

  publish-release:
    needs: build-and-upload
    runs-on: ubuntu-latest
    steps:
      - name: Undraft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false
